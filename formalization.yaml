project:
  name: Endpoint power weight inequalities for spherical maximal functions in Lean
  description: 'This is a Lean 4 formalization of Theorems 1.1-1.4 from the paper "Endpoint power
    weight inequalities for spherical maximal functions" by M. Fraccaroli, J. Lee, N. Lei, J. Roos
    and A. Seeger.


    Sharp power-weight estimates are established for spherical maximal functions, including the critical
    weight for the full operator and a bound controlled by the uniform local Assouad dimension of
    restricted radii. Exact weighted boundedness regions are characterized for convex sequences and
    their dyadic globalizations, above the critical integrability exponent.


    Reference: https://arxiv.org/abs/2610.18316v1.'
