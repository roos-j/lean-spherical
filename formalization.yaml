fidelity:
  divergences: >-
    The type set is defined by uniform a priori estimates on Schwartz functions,
    for exponents 1 <= p, q <= infinity. Covering numbers use closed balls in
    base-two logarithmic coordinates on the positive radii; on [1,2] this is
    bi-Lipschitz equivalent to the Euclidean metric. The quasi-Assouad dimension is
    defined as the limit as theta tends to 1 from below of the upper Assouad
    spectrum, in which all window lengths between r^theta and 1 are allowed. In
    Theorem 1.2 (i) the nonemptiness of E, implicit in the paper, is an explicit
    hypothesis, and W ranges over all subsets of the plane rather than of the unit
    square; these formulations are equivalent. In Theorem 1.2 (ii) the minimality
    of the parameter g is stated as an explicit hypothesis. The Challenge's sorries
    are deliberate and are excluded from the proof-development counts.
