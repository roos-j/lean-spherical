version: v0.4
project:
  name: Power weight inequalities for spherical maximal functions
  description: >-
    This is a Lean 4 formalization of Theorem 1.1 from the paper "Power weight
    inequalities for spherical maximal functions" by M. Fraccaroli, J. Roos,
    and A. Seeger, 2602.17613.

    Spherical maximal functions with arbitrary sets of positive dilation radii
    are studied on Lebesgue spaces with radial power weights. The allowable
    exponent and weight ranges are characterized, apart from endpoint
    boundedness, by the Legendre-Assouad function of the dilation set. An open
    problem of Duoandikoetxea and Seijo is thereby resolved up to endpoints.
  authors: [Joris Roos]
